name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync

      # Everything: biome, eslint, tsc on both packages, vitest, ruff, pytest.
      # The suite replays the committed run rather than probing, so CI fetches no feeds.
      - run: npm run check
